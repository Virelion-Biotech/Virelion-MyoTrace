[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virelion-myotrace"
version = "0.4.0"
description = "Reproducible video cardiac mechanics analysis and auditable multimodal tissue maturity fusion."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Virelion-Biotech"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["cardiac", "contractility", "EHT", "organoid", "optical-flow", "maturation", "mechanobiology", "multimodal", "reproducibility"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
tiff = ["tifffile>=2023.8"]
report = ["matplotlib>=3.8"]
all = ["opencv-python-headless>=4.8", "tifffile>=2023.8", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "pytest-cov>=5"]

[project.scripts]
myotrace = "myotrace.cli:main"
myotrace-hearttwin = "myotrace.hearttwin_adapter:main"

[tool.setuptools.packages.find]
include = ["myotrace*", "fusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "build", "dist"]
