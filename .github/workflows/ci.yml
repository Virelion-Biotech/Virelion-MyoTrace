name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            numpy-spec: 'numpy>=1.26,<2'
            scipy-spec: 'scipy>=1.10,<1.15'
            opencv-spec: 'opencv-python-headless>=4.8,<4.11'
            tifffile-spec: 'tifffile>=2023.8,<2026'
          - python-version: '3.11'
            numpy-spec: 'numpy>=1.26,<2'
            scipy-spec: 'scipy>=1.10,<1.15'
            opencv-spec: 'opencv-python-headless>=4.8,<4.11'
            tifffile-spec: 'tifffile>=2023.8,<2026'
          - python-version: '3.12'
            numpy-spec: 'numpy>=1.26,<2'
            scipy-spec: 'scipy>=1.10,<1.15'
            opencv-spec: 'opencv-python-headless>=4.8,<4.11'
            tifffile-spec: 'tifffile>=2023.8,<2026'
          - python-version: '3.10'
            numpy-spec: 'numpy>=2,<3'
            scipy-spec: 'scipy>=1.10'
            opencv-spec: 'opencv-python-headless>=4.8'
            tifffile-spec: 'tifffile>=2023.8'
          - python-version: '3.11'
            numpy-spec: 'numpy>=2,<3'
            scipy-spec: 'scipy>=1.10'
            opencv-spec: 'opencv-python-headless>=4.8'
            tifffile-spec: 'tifffile>=2023.8'
          - python-version: '3.12'
            numpy-spec: 'numpy>=2,<3'
            scipy-spec: 'scipy>=1.10'
            opencv-spec: 'opencv-python-headless>=4.8'
            tifffile-spec: 'tifffile>=2023.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "${{ matrix.numpy-spec }}" "${{ matrix.scipy-spec }}" "${{ matrix.opencv-spec }}" "${{ matrix.tifffile-spec }}" pandas matplotlib pytest ruff build
      - run: pip install -e . --no-deps
      - run: ruff check . --select F
      - run: pytest -q
      - run: python -c 'import numpy as np; from myotrace.robust import spectral_features; print(np.__version__, spectral_features(np.sin(np.linspace(0,20,1000)), 50)["band_power"])'
      - run: python -m build

  research-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[all,dev]'
      - run: |
          python - <<'PY'
          from fusion.model import FeatureReference, FusionConfig, calculate_index
          cfg = FusionConfig(references={
              'mechanical:beat_rate_bpm': FeatureReference(60, 120),
              'electrical:fpd_ms': FeatureReference(100, 200),
              'molecular:MYH7_MYH6_ratio': FeatureReference(0.2, 2.0),
          })
          r = calculate_index('CI', {
              'mechanical:beat_rate_bpm': 120,
              'electrical:fpd_ms': 200,
              'molecular:MYH7_MYH6_ratio': 2.0,
          }, cfg)
          assert r.composite_score == 100.0
          assert r.confidence == 1.0
          assert r.coherence_score == 1.0
          PY
